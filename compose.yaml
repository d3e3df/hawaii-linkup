services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linkup
      POSTGRES_USER: linkup
      POSTGRES_PASSWORD: linkup
    ports:
      - "127.0.0.1:${LINKUP_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkup -d linkup"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - linkup-postgres:/var/lib/postgresql/data

volumes:
  linkup-postgres:
